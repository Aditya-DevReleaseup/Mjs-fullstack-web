name: CI/CD for Surveyor API

on:
  push:
    branches:
      - main
     
    

jobs:
  Production-Image:
    runs-on: [self-hosted-india]
    name: Building Production APP
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Building Docker image for Production
        run: |
         
          sudo docker compose build api-backend

      - name: Deploying Docker container for Production
        run: |
          sudo docker compose up -d api-backend

      - name: Cleaning Docker Cache
        run: |
          sudo docker system prune -a -f

  
